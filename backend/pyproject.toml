[project]
name = "portfolio-bot"
version = "0.1.0"
description = "Retrieval-augmented chatbot backend for a personal portfolio site"
requires-python = ">=3.12,<3.13"

# Runtime dependencies are declared by the unit that first needs them.
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    # Listed directly only so the source below applies to it. sentence-transformers would
    # pull it in anyway.
    "torch>=2.2",
]

# On Linux (CI and the production container), torch comes from PyTorch's CPU-only index.
# The default PyPI wheel bundles CUDA libraries, gigabytes this project never uses because
# the embedding model runs on CPU. macOS wheels are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
pb = "portfolio_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_bot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "database: needs a running Postgres. Creates and drops a throwaway database.",
    "model: downloads and runs the real embedding model. Skipped unless --run-model.",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
